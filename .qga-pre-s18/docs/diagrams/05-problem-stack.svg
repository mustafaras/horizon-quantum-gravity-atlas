<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" role="img" aria-label="Quantum Gravity Problem Stack">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#10162a"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#46d4e0"/></marker>
</defs>
<rect width="100%" height="100%" rx="18" fill="url(#bg)"/>
<text x="40" y="48" fill="#e8eef8" font-family="Space Grotesk,Segoe UI,Arial" font-size="26" font-weight="700">Quantum Gravity Problem Stack</text>
<text x="40" y="76" fill="#93a1ba" font-family="IBM Plex Mono,Consolas,monospace" font-size="13">from established theories to open frontier</text>
<rect x="250" y="105" width="480" height="54" rx="12" fill="#0f172a" stroke="#5ee6a8" stroke-width="1.6"/>
<text x="490" y="128" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Standard Model</text>
<text x="490" y="146" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">quantum fields + gauge symmetry</text>
<line x1="490" y1="159" x2="490" y2="181" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="250" y="181" width="480" height="54" rx="12" fill="#0f172a" stroke="#5ee6a8" stroke-width="1.6"/>
<text x="490" y="204" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Quantum Field Theory</text>
<text x="490" y="222" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">amplitudes + renormalization</text>
<line x1="490" y1="235" x2="490" y2="257" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="250" y="257" width="480" height="54" rx="12" fill="#0f172a" stroke="#5ee6a8" stroke-width="1.6"/>
<text x="490" y="280" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">General Relativity</text>
<text x="490" y="298" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">dynamical spacetime geometry</text>
<line x1="490" y1="311" x2="490" y2="333" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="250" y="333" width="480" height="54" rx="12" fill="#0f172a" stroke="#ffb454" stroke-width="1.6"/>
<text x="490" y="356" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Structural Clash</text>
<text x="490" y="374" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">QFT assumes background; GR makes it dynamical</text>
<line x1="490" y1="387" x2="490" y2="409" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="250" y="409" width="480" height="54" rx="12" fill="#0f172a" stroke="#ffb454" stroke-width="1.6"/>
<text x="490" y="432" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Planck Frontier</text>
<text x="490" y="450" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">E / E_P expansion loses predictive power</text>
<line x1="490" y1="463" x2="490" y2="485" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="250" y="485" width="480" height="54" rx="12" fill="#0f172a" stroke="#b388ff" stroke-width="1.6"/>
<text x="490" y="508" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Candidate Programs</text>
<text x="490" y="526" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">strings, loops, asymptotic safety, holography</text>
<line x1="490" y1="539" x2="490" y2="561" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="250" y="561" width="480" height="54" rx="12" fill="#0f172a" stroke="#b388ff" stroke-width="1.6"/>
<text x="490" y="584" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Black Holes</text>
<text x="490" y="602" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">entropy, horizons, information</text>
<line x1="490" y1="615" x2="490" y2="637" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="250" y="637" width="480" height="54" rx="12" fill="#0f172a" stroke="#46d4e0" stroke-width="1.6"/>
<text x="490" y="660" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Experimental Constraints</text>
<text x="490" y="678" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">colliders, GW, cosmology, EHT</text>
</svg>
