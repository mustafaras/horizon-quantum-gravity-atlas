<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" width="1080" height="420" role="img" aria-label="Screenshot Reproducibility Flow">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#10162a"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#46d4e0"/></marker>
</defs>
<rect width="100%" height="100%" rx="18" fill="url(#bg)"/>
<text x="40" y="48" fill="#e8eef8" font-family="Space Grotesk,Segoe UI,Arial" font-size="26" font-weight="700">Screenshot Reproducibility Flow</text>
<text x="40" y="76" fill="#93a1ba" font-family="IBM Plex Mono,Consolas,monospace" font-size="13">real app state -&gt; captured visual -&gt; README atlas</text>
<rect x="80" y="185" width="130" height="70" rx="12" fill="#0f172a" stroke="#5ee6a8" stroke-width="1.6"/>
<text x="145" y="216" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Local HTTP</text>
<text x="145" y="234" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">server</text>
<line x1="210" y1="220" x2="260" y2="220" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="260" y="185" width="130" height="70" rx="12" fill="#0f172a" stroke="#5ee6a8" stroke-width="1.6"/>
<text x="325" y="216" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Chrome /</text>
<text x="325" y="234" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Playwright</text>
<line x1="390" y1="220" x2="440" y2="220" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="440" y="185" width="130" height="70" rx="12" fill="#0f172a" stroke="#54aeff" stroke-width="1.6"/>
<text x="505" y="216" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">localStorage</text>
<text x="505" y="234" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">view key</text>
<line x1="570" y1="220" x2="620" y2="220" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="620" y="185" width="130" height="70" rx="12" fill="#0f172a" stroke="#54aeff" stroke-width="1.6"/>
<text x="685" y="216" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Target</text>
<text x="685" y="234" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">module</text>
<line x1="750" y1="220" x2="800" y2="220" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="800" y="185" width="130" height="70" rx="12" fill="#0f172a" stroke="#b388ff" stroke-width="1.6"/>
<text x="865" y="216" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Render wait</text>
<text x="865" y="234" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">WebGL + motion</text>
<line x1="930" y1="220" x2="980" y2="220" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="960" y="185" width="130" height="70" rx="12" fill="#0f172a" stroke="#b388ff" stroke-width="1.6"/>
<text x="1025" y="216" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">PNG in</text>
<text x="1025" y="234" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">docs/screenshots</text>
</svg>
