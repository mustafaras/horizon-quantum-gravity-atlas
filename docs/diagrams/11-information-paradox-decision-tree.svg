<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="1100" height="660" role="img" aria-label="Information Paradox Decision Tree">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080f"/><stop offset="1" stop-color="#10162a"/></linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#46d4e0"/></marker>
</defs>
<rect width="100%" height="100%" rx="18" fill="url(#bg)"/>
<text x="40" y="48" fill="#e8eef8" font-family="Space Grotesk,Segoe UI,Arial" font-size="26" font-weight="700">Information Paradox Decision Tree</text>
<text x="40" y="76" fill="#93a1ba" font-family="IBM Plex Mono,Consolas,monospace" font-size="13">where semiclassical gravity and quantum unitarity collide</text>
<rect x="420" y="95" width="260" height="60" rx="12" fill="#0f172a" stroke="#5ee6a8" stroke-width="1.6"/>
<text x="550" y="121" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Black hole forms</text>
<text x="550" y="139" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">from pure state</text>
<rect x="420" y="205" width="260" height="60" rx="12" fill="#0f172a" stroke="#ffb454" stroke-width="1.6"/>
<text x="550" y="231" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Hawking radiation</text>
<text x="550" y="249" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">appears thermal</text>
<line x1="550" y1="155" x2="550" y2="205" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="420" y="315" width="260" height="60" rx="12" fill="#0f172a" stroke="#ffb454" stroke-width="1.6"/>
<text x="550" y="341" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Radiation exactly</text>
<text x="550" y="359" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">thermal?</text>
<line x1="550" y1="265" x2="550" y2="315" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="130" y="445" width="230" height="70" rx="12" fill="#0f172a" stroke="#ff7b72" stroke-width="1.6"/>
<text x="245" y="476" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Information</text>
<text x="245" y="494" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">apparently lost</text>
<rect x="740" y="445" width="230" height="70" rx="12" fill="#0f172a" stroke="#5ee6a8" stroke-width="1.6"/>
<text x="855" y="476" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Correlations encode</text>
<text x="855" y="494" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">information</text>
<line x1="420" y1="345" x2="360" y2="470" stroke="#ff7b72" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><line x1="680" y1="345" x2="740" y2="470" stroke="#5ee6a8" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="420" y="545" width="260" height="60" rx="12" fill="#0f172a" stroke="#b388ff" stroke-width="1.6"/>
<text x="550" y="571" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Page curve / islands</text>
<text x="550" y="589" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">/ microstates</text>
<line x1="245" y1="515" x2="420" y2="575" stroke="#b388ff" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><line x1="855" y1="515" x2="680" y2="575" stroke="#b388ff" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/></svg>
