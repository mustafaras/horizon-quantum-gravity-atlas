<text x="420" y="291" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Spacetime</text>
<text x="420" y="309" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">geometry</text>
<line x1="560" y1="179" x2="420" y2="260" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="570" y="260" width="180" height="70" rx="12" fill="#0f172a" stroke="#ffb454" stroke-width="1.6"/>
<text x="660" y="291" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">QFT / GR</text>
<text x="660" y="309" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">conflict</text>
