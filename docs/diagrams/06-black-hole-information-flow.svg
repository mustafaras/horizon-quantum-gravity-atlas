<text x="145" y="233" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Collapse</text>
<text x="145" y="251" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">forms horizon</text>
<line x1="220" y1="237" x2="260" y2="237" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="260" y="200" width="150" height="74" rx="12" fill="#0f172a" stroke="#46d4e0" stroke-width="1.6"/>
<text x="335" y="224" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Quantum fields</text>
<text x="335" y="242" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">on curved</text>
<text x="335" y="260" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">spacetime</text>
<line x1="410" y1="237" x2="450" y2="237" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="450" y="200" width="150" height="74" rx="12" fill="#0f172a" stroke="#ffb454" stroke-width="1.6"/>
<text x="525" y="233" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Hawking</text>
<text x="525" y="251" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">radiation</text>
<line x1="600" y1="237" x2="640" y2="237" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="640" y="200" width="150" height="74" rx="12" fill="#0f172a" stroke="#ffb454" stroke-width="1.6"/>
<text x="715" y="233" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Radiation</text>
<text x="715" y="251" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">entropy</text>
<line x1="790" y1="237" x2="830" y2="237" stroke="#46d4e0" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/><rect x="830" y="200" width="150" height="74" rx="12" fill="#0f172a" stroke="#ff7b72" stroke-width="1.6"/>
<text x="905" y="233" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Unitarity</text>
<text x="905" y="251" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">tension</text>
<rect x="395" y="350" width="330" height="70" rx="12" fill="#0f172a" stroke="#b388ff" stroke-width="1.6"/>
<text x="560" y="381" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Page curve required if evaporation</text>
<text x="560" y="399" text-anchor="middle" fill="#e8eef8" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">is unitary</text>
<line x1="905" y1="274" x2="560" y2="350" stroke="#b388ff" stroke-width="2" marker-end="url(#arrow)" opacity="0.85"/></svg>
