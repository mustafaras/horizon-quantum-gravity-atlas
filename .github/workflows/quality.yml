name: Repository Quality

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full browser QA suite
        type: boolean
        default: true
      themes:
        description: Run the three-theme QA (a11y in each theme, theme specs, evidence screenshots)
        type: boolean
        default: false
      theme_baselines:
        description: With themes, regenerate the Blueprint and Print baselines and upload them (never commits them)
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  validate:
    name: Validate README, assets, and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install pinned test dependencies
        run: npm ci

      - name: Run physics and renderer contract tests
        run: npm test

      - name: Run repository validation
        run: npm run validate

  browser:
    name: Browser QA (Playwright, pinned Chromium)
    # Pinned: Playwright 1.58 has no browser build for ubuntu 26.04, which
    # `ubuntu-latest` now resolves to. Keep this on a supported image.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # The merge commit and its first parent: what scripts/ci/browser-scope.mjs compares.
          fetch-depth: 2

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # A change to documents only (the ledger, notes, screenshots) needs no browser run. The job still runs and
      # reports success, so a required "Browser QA" check is satisfied. Scheduled and manual runs run everything.
      - name: Decide what this change needs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/browser-scope.mjs

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Chromium
        if: steps.scope.outputs.code == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify capture manifest
        run: npm run qa:verify

      # Only a renderer, three.js, QA harness, package or workflow change can move the native WebGPU boundary.
      - name: Verify native renderer boundary first
        if: steps.scope.outputs.render == 'true'
        env:
          # Surface pinned Chromium/GPU-process stderr for software WebGPU triage.
          DEBUG: pw:browser
        run: npm run qa:test -- qa/specs/render-backends.spec.mjs --grep "real WebGPU API on a software adapter"

      - name: Preserve native renderer evidence
        if: always() && steps.scope.outputs.render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: native-renderer-evidence
          path: |
            qa/test-results/**/*.json
            qa/test-results/**/sm-native-webgpu-software.png
          retention-days: 7

      # PRs and pushes gate on the critical subset; the full suite runs weekly or on demand.
      - name: Run critical browser QA
        if: steps.scope.outputs.code == 'true' && (github.event_name == 'push' || github.event_name == 'pull_request' || !inputs.full)
        run: npm run qa:critical

      - name: Run full browser QA suite
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full)
        run: npm run qa:test -- --grep-invert "real WebGPU API on a software adapter"

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-failure
          path: |
            qa/test-results/
            qa/output/
          retention-days: 7

  # S34: the same accessibility spec in every theme, the theme specs, and a picture of each module in Blueprint and
  # Print. Manual only (workflow_dispatch with themes=true); every step runs so one red theme does not hide another.
  themes:
    name: Theme QA (Observatory, Blueprint, Print)
    if: github.event_name == 'workflow_dispatch' && inputs.themes
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility spec, Observatory
        if: always()
        env:
          QGA_QA_THEME: observatory
        run: npx playwright test --config qa/playwright.config.mjs qa/specs/a11y.spec.mjs

      - name: Accessibility spec, Blueprint
        if: always()
        env:
          QGA_QA_THEME: blueprint
        run: npx playwright test --config qa/playwright.config.mjs qa/specs/a11y.spec.mjs

      - name: Accessibility spec, Print
        if: always()
        env:
          QGA_QA_THEME: print
        run: npx playwright test --config qa/playwright.config.mjs qa/specs/a11y.spec.mjs

      - name: Theme specs
        if: always()
        run: npx playwright test --config qa/playwright.config.mjs qa/specs/themes.spec.mjs

      - name: Evidence screenshots, Blueprint and Print
        if: always()
        env:
          QGA_THEME_SHOTS: evidence
        run: npx playwright test --config qa/playwright.config.mjs qa/specs/themes-visual.spec.mjs

      # Baselines are made on this platform (Linux, pinned Chromium) and compared on it, so they are generated here and
      # downloaded by a person who has looked at the evidence images first; the workflow never commits them.
      - name: Regenerate theme baselines
        if: always() && inputs.theme_baselines
        env:
          QGA_THEME_SHOTS: compare
        run: npx playwright test --config qa/playwright.config.mjs qa/specs/themes-visual.spec.mjs --update-snapshots

      - name: Compare with the committed theme baselines
        if: always() && !inputs.theme_baselines && hashFiles('qa/baselines/theme-*.png') != ''
        env:
          QGA_THEME_SHOTS: compare
        run: npx playwright test --config qa/playwright.config.mjs qa/specs/themes-visual.spec.mjs

      - name: Upload regenerated baselines
        if: always() && inputs.theme_baselines
        uses: actions/upload-artifact@v4
        with:
          name: theme-baselines
          path: qa/baselines/theme-*.png
          retention-days: 14

      - name: Upload theme evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-evidence
          path: |
            qa/output/themes/
            qa/test-results/
          retention-days: 14
